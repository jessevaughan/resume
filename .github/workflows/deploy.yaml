name: Deploy

# Only push-to-main and manual runs. Deliberately NOT pull_request: this repo is
# public, and while GitHub already withholds secrets from fork PRs, the simplest
# guarantee is that nothing a stranger can trigger ever touches the licensed
# fonts or the deploy key.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. cancel-in-progress stays false — killing a run mid-rsync
# would leave the server in a half-written state.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tripwire, not a fix. src/data/letters/ is gitignored, so a CI checkout
      # cannot contain a cover letter and import.meta.glob resolves to nothing.
      # If that ever stops being true, this fails before anything is built
      # rather than after it is deployed.
      - name: Assert no cover letters in the checkout
        run: |
          if [ -d src/data/letters ]; then
            echo "::error::src/data/letters exists in CI. It must stay gitignored."
            exit 1
          fi
          echo "No letters in checkout, as expected."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Downloads Chrome for puppeteer as a postinstall step, which the PDF
      # render needs. Adds roughly half a minute on a cold cache.
      - run: npm ci

      # Licensed fonts, base64, split across two secrets each because GitHub
      # caps a secret near 48KB and these run ~75KB encoded. They are
      # gitignored and must not be committed even encrypted — the Displaay
      # license grants hosting and rendering rights, not storage in a repo.
      # Secrets are encrypted at rest and never exposed to fork workflows.
      #
      # To regenerate:
      #   base64 -i FONT.woff2 | tr -d '\n' | split -b 38000 - /tmp/part-
      #
      # Archivo is open source and committed directly, so it needs no secret.
      # No .woff: Vite ships an ES-module bundle, so every browser that can run
      # this app supports woff2 and the fallbacks were unreachable.
      - name: Restore licensed fonts
        env:
          SERRIF_LIGHT_A: ${{ secrets.SERRIF_LIGHT_A }}
          SERRIF_LIGHT_B: ${{ secrets.SERRIF_LIGHT_B }}
          SERRIF_ITALIC_A: ${{ secrets.SERRIF_ITALIC_A }}
          SERRIF_ITALIC_B: ${{ secrets.SERRIF_ITALIC_B }}
          SERRIF_ITALIC_C: ${{ secrets.SERRIF_ITALIC_C }}
        run: |
          set -euo pipefail
          write() {
            name="$1"; shift
            joined=""
            for part in "$@"; do
              if [ -z "$part" ]; then
                echo "::error::A secret part for $name is empty."
                exit 1
              fi
              joined="$joined$part"
            done
            printf '%s' "$joined" | tr -d '\n' | base64 -d > "public/fonts/$name"
            # woff2 files start with the magic bytes wOF2. If a split was
            # botched or a secret truncated, the decode still "succeeds" and
            # produces garbage, so check the header rather than the exit code.
            if [ "$(head -c 4 "public/fonts/$name")" != "wOF2" ]; then
              echo "::error::$name is not a valid woff2 after reassembly."
              exit 1
            fi
          }
          write SerrifCompressed-Light.woff2       "$SERRIF_LIGHT_A" "$SERRIF_LIGHT_B"
          write SerrifCompressed-LightItalic.woff2 "$SERRIF_ITALIC_A" "$SERRIF_ITALIC_B" "$SERRIF_ITALIC_C"
          ls -lh public/fonts/*.woff2 | awk '{print $5, $9}'

      # pdftotext, for the ATS reading-order check inside scripts/pdf.mjs.
      # Without it that check is skipped and the PDFs still generate, which is
      # exactly the silent pass this pipeline exists to prevent.
      - name: Install poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - run: npm run lint

      # build -> PDFs -> ATS check -> clean rebuild -> copy PDFs -> letter guard.
      # Any failure here stops the deploy, so a copy edit that breaks reading
      # order or trips a track guardrail never reaches the server.
      - name: Build, render PDFs, verify
        run: npm run ship

      - name: Deploy over rsync
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned rather than ssh-keyscan'd at run time: keyscan trusts whatever
          # answers, which defeats the point of checking at all.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Trailing slash on dist/ copies the CONTENTS, not the directory.
          # Without it you get a dist/ folder inside the web root.
          rsync -avz --delete \
            --exclude='.dh-diag' \
            --exclude='.well-known/***' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Confirm the site answers
        run: |
          set -euo pipefail
          for path in "" engineering; do
            url="https://resume.jessevaughan.com/$path"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || exit 1
          done
